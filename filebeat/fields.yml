- key: app
  title: Application
  fields:
    - name: level
      type: keyword
      description: >
        Log level label: trace, debug, info, warn, error, fatal (string via pino formatters.level)
    - name: time
      type: date
      format: epoch_millis
      description: Log timestamp in milliseconds since epoch (from pino)
    - name: msg
      type: text
      description: Human-readable log message
    - name: pid
      type: long
    - name: hostname
      type: keyword
    - name: service
      type: keyword
      description: Service name (from package.json name)
    - name: version
      type: keyword
      description: Service version (from package.json version)
    - name: env
      type: keyword
      description: Runtime environment (production, development, test)
    - name: event
      type: keyword
      description: Structured event name, e.g. server.started, subscription.created
    - name: repo
      type: keyword
      description: GitHub repository full name (owner/repo)
    - name: reqId
      type: keyword
      description: Per-request ID for log correlation
    - name: port
      type: long
    - name: err
      type: object
      fields:
        - name: message
          type: text
        - name: type
          type: keyword
        - name: stack
          type: text
