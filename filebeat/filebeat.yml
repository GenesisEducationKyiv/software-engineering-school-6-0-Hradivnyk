filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true

processors:
  - add_docker_metadata:
      host: 'unix:///var/run/docker.sock'
  - decode_json_fields:
      fields: [message]
      target: ''
      overwrite_keys: true
      add_error_key: true  # marks non-JSON lines with error.message; record is never dropped
  - drop_fields:
      fields:
        - 'container.labels.com_docker_compose_*'
        - 'container.labels.co_elastic_logs*'
        - 'agent.ephemeral_id'
        - 'agent.id'
        - 'agent.name'
        - 'agent.type'
        - 'agent.version'
        - 'ecs.version'
        - 'log.offset'
        - 'input.type'
      ignore_missing: true

output.elasticsearch:
  hosts: ['elasticsearch:9200']
  index: 'app-logs-%{+yyyy.MM.dd}'

setup.template.name: 'app-logs'
setup.template.pattern: 'app-logs-*'
setup.template.overwrite: true
setup.template.fields: /usr/share/filebeat/fields.yml
setup.ilm.enabled: false

logging.level: warning
